<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{{ config.description }}" />
    <meta property="og:title" content="{{ config.title }}" />
    <meta property="og:description" content="{{ config.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ config.base_url }}" />
    <link rel="stylesheet" href="{{ get_url(path='css/site.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Flan MCP</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#features">Notable Features</a>
        <a href="#workflow">Workflow</a>
        <a href="#demo">Demo</a>
        <a href="#tools">Tools</a>
        <a href="{{ config.extra.repo_url }}" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      <p>Apache 2.0 | Built for Flutter teams shipping with AI.</p>
      <a href="{{ config.extra.docs_url }}" target="_blank" rel="noreferrer">View package docs</a>
    </footer>
  </body>
</html>
