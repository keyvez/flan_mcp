[package]
name = "flan-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "flan-server"
path = "src/main.rs"

[[bin]]
name = "flan-tui"
path = "src/bin/flan_tui.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2.183"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
